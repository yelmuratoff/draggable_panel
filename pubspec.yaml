name: draggable_panel
description: A floating panel that behaves like a system Picture-in-Picture window — drag it anywhere, spring-snap to corners, stash it off the edge, tap to grow it in place.
version: 4.0.0-beta.7
homepage: https://github.com/yelmuratoff/draggable_panel.git
issue_tracker: https://github.com/yelmuratoff/draggable_panel/issues

topics:
  - draggable-panel
  - picture-in-picture
  - floating-panel
  - animation
  - accessibility

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
