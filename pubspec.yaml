name: draggable_panel
description: A floating panel window — drag it anywhere, spring-snap to the nearest side, stash it off the edge, tap to grow it in place.
version: 4.1.0
homepage: https://github.com/yelmuratoff/draggable_panel
repository: https://github.com/yelmuratoff/draggable_panel
issue_tracker: https://github.com/yelmuratoff/draggable_panel/issues

topics:
  - draggable-panel
  - floating-panel
  - animation
  - accessibility

screenshots:
  - description: "A collapsed panel floating over the app's own scrolling page."
    path: assets/screenshots/floating-window.png
  - description: "The same panel tapped open, grown in place at the corner it sat in."
    path: assets/screenshots/expanded-in-place.png
  - description: "The DraggableActionPanel preset: an action grid over a button row."
    path: assets/screenshots/action-grid.png
  - description: "Pushed off the side, the panel parks as a tab you can pull back."
    path: assets/screenshots/parked-at-the-edge.png

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
